<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/star.png" type="image/png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
    <!-- Umami page-view analytics, shared with the portfolio's site id; only counts the deployed demo. -->
    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="11584e7e-393a-4b1e-94eb-7662ee704b70"
      data-domains="expense-tracker-fe-nu.vercel.app"
    ></script>
    <script>
      // Set the theme before first paint so dark mode doesn't flash light.
      try {
        var t = localStorage.getItem('theme-mode');
        if (t !== 'light' && t !== 'dark')
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
